# azure-pipelines.yml
trigger:
  - main

variables:
  azureServiceConnection: 'azure'                  
  backendRG: 'RG'                 
  backendStorage: 'tfstatefilestore1678'          
  backendContainer: 'tfstate-container'                    
  imageRepository: 'my-app'                      
  projectPrefix: 'nodeapp'                       # Short prefix used to standardise structural asset naming
  # Build a shared ACR tag string targeting the environment where the container compilation lands
  sharedAcrName: 'acrnodeappdev'

stages:
  # =========================================================================
  # STAGE 1: Provision Core Infrastructure (Ensures cluster & registries exist)
  # =========================================================================
  - stage: InfrastructureProvisioning
    displayName: '1. Provision Cloud Topologies'
    jobs:
      - job: ProvisionBaseAssets
        displayName: 'Execute Parallel Multi-Env Base Terraform'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          # Loop compilation definitions dynamically for each target environment workspace profile sequentially
          - ${{ each env in ['dev', 'qa', 'prod'] }}:
            - task: TerraformTaskV4@4
              displayName: 'Init Backend State [${{ env }}]'
              inputs:
                provider: 'azurerm'
                command: 'init'
                workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
                backendServiceArm: '$(azureServiceConnection)'
                backendAzureRmResourceGroupName: '$(backendRG)'
                backendAzureRmStorageAccountName: '$(backendStorage)'
                backendAzureRmContainerName: '$(backendContainer)'
                backendAzureRmKey: '${{ env }}..terraform.tfstate'

            - task: TerraformTaskV4@4
              displayName: 'Apply Infrastructure [${{ env }}]'
              inputs:
                provider: 'azurerm'
                command: 'apply'
                workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
                environmentServiceNameAzureRM: '$(azureServiceConnection)'
                commandOptions: '-var-file="environments/${{ env }}.tfvars" -auto-approve'

  # =========================================================================
  # STAGE 2: Build Node.js Application and Push Container to Live Dev ACR
  # =========================================================================
  - stage: BuildAndPushApp
    displayName: '2. Containerise Application'
    dependsOn: InfrastructureProvisioning
    condition: succeeded()
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Setup Node.js Environment'

          - script: |
              npm ci
              npm run build --if-present
            displayName: 'Compile Production Target JavaScript'

          # Fixes the authentication loophole by bypassing generic Docker wrappers with explicit OIDC shells
          - task: AzureCLI@2
            displayName: 'Authenticate and Push to Shared Dev ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(sharedAcrName)
                docker build -t $(sharedAcrName).azurecr.io/$(imageRepository):$(Build.BuildId) -t $(sharedAcrName).azurecr.io/$(imageRepository):latest .
                docker push $(sharedAcrName).azurecr.io/$(imageRepository):$(Build.BuildId)
                docker push $(sharedAcrName).azurecr.io/$(imageRepository):latest

          # Package application configuration parameters for subsequent stage deployment workers
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Infrastructure Modules Artifact'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)'
              artifact: 'infrastructure-drop'
              publishLocation: 'pipeline'

  # =========================================================================
  # STAGE 3: Deploy Application to the DEV Environment
  # =========================================================================
  - stage: DeployDev
    displayName: '3. Deploy to DEV'
    dependsOn: BuildAndPushApp
    condition: succeeded()
    jobs:
      - deployment: DeployDevCluster
        displayName: 'Deploy App to Dev AKS Pool'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'DEV-Environment' # Maps deployment history tracking in UI
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env-template.yml
                  parameters:
                    environment: 'dev'
                    azureServiceConnection: '$(azureServiceConnection)'
                    projectPrefix: '$(projectPrefix)'
                    acrName: '$(sharedAcrName)'
                    imageRepository: '$(imageRepository)'
                    imageTag: '$(Build.BuildId)'

  # =========================================================================
  # STAGE 4: Deploy Application to the QA Environment (Enforces Quality Gates)
  # =========================================================================
  - stage: DeployQA
    displayName: '4. Deploy to QA'
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - deployment: DeployQACluster
        displayName: 'Deploy App to QA AKS Pool'
        pool:
          vmImage: 'ubuntu-latest'
        # 🚦 DEV OVERSIGHT GATEWAY: Apply automated check criteria (Azure Monitor / API Hooks) here
        environment: 'QA-Environment'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env-template.yml
                  parameters:
                    environment: 'qa'
                    azureServiceConnection: '$(azureServiceConnection)'
                    projectPrefix: '$(projectPrefix)'
                    acrName: '$(sharedAcrName)'
                    imageRepository: '$(imageRepository)'
                    imageTag: '$(Build.BuildId)'

  # =========================================================================
  # STAGE 5: Deploy Application to the PROD Environment (Enforces Control Gates)
  # =========================================================================
  - stage: DeployProd
    displayName: '5. Deploy to PROD'
    dependsOn: DeployQA
    condition: succeeded()
    jobs:
      - deployment: DeployProdCluster
        displayName: 'Deploy App to Production AKS Pool'
        pool:
          vmImage: 'ubuntu-latest'
        # 🔒 PRODUCTION SECURITY BLANKET: Apply Manual Approvals and Business Hours here
        environment: 'PROD-Environment-Gate'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env-template.yml
                  parameters:
                    environment: 'prod'
                    azureServiceConnection: '$(azureServiceConnection)'
                    projectPrefix: '$(projectPrefix)'
                    acrName: '$(sharedAcrName)'
                    imageRepository: '$(imageRepository)'
                    imageTag: '$(Build.BuildId)'
