# azure-pipelines.yml
trigger:
  - main

variables:
  azureServiceConnection: 'azure'                  # Exact string identifier of your Azure DevOps Service Connection
  backendRG: 'RG'                 # Shared infrastructure resource group for state management
  backendStorage: 'tfstatefilestore1678 '          # Globally unique central storage account name
  backendContainer: 'tfstate-container'                    # Blob storage target container
  imageRepository: 'my-app'                      # Name of your image registry repository
  projectPrefix: 'nodeapp'                       # Short prefix string used to standardise cloud asset naming

stages:
  # =========================================================================
  # STAGE 1: Code Compilation & Baseline Validation Layer
  # =========================================================================
  - stage: BuildAndPackage
    displayName: '1. Build & Package App Context'
    jobs:
      - job: CompileCode
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Setup Node.js Environment'

          - script: |
              npm ci
              npm run build --if-present
            displayName: 'Compile Production Target JavaScript'

          # Drop the code workspace so subsequent environment stage workers can pick it up
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Deployment Infrastructure Drop'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)'
              artifact: 'infrastructure-drop'
              publishLocation: 'pipeline'

  # =========================================================================
  # STAGE 2: Deployment & Provisioning Flow for the DEV Environment
  # =========================================================================
  - stage: DeployDev
    displayName: '2. Deploy to DEV'
    dependsOn: BuildAndPackage
    condition: succeeded()
    jobs:
      - deployment: DevClusterDeployment
        displayName: 'Provision and Deploy Dev Stage'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'DEV-Environment' # Triggers immediate automated rollout
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env-template.yml
                  parameters:
                    environment: 'dev'
                    azureServiceConnection: '$(azureServiceConnection)'
                    backendRG: '$(backendRG)'
                    backendStorage: '$(backendStorage)'
                    backendContainer: '$(backendContainer)'
                    projectPrefix: '$(projectPrefix)'
                    imageRepository: '$(imageRepository)'
                    imageTag: '$(Build.BuildId)'

  # =========================================================================
  # STAGE 3: Deployment & Provisioning Flow for the QA Environment (Gated)
  # =========================================================================
  - stage: DeployQA
    displayName: '3. Deploy to QA'
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - deployment: QaClusterDeployment
        displayName: 'Provision and Deploy QA Stage'
        pool:
          vmImage: 'ubuntu-latest'
        # 🚦 DEV TO QA APPROVAL GATE: Pipeline stops here until manually authorized in the UI
        environment: 'QA-Environment'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env-template.yml
                  parameters:
                    environment: 'qa'
                    azureServiceConnection: '$(azureServiceConnection)'
                    backendRG: '$(backendRG)'
                    backendStorage: '$(backendStorage)'
                    backendContainer: '$(backendContainer)'
                    projectPrefix: '$(projectPrefix)'
                    imageRepository: '$(imageRepository)'
                    imageTag: '$(Build.BuildId)'

  # =========================================================================
  # STAGE 4: Deployment & Provisioning Flow for the PROD Environment (Gated)
  # =========================================================================
  - stage: DeployProd
    displayName: '4. Deploy to PROD'
    dependsOn: DeployQA
    condition: succeeded()
    jobs:
      - deployment: ProdClusterDeployment
        displayName: 'Provision and Deploy Prod Stage'
        pool:
          vmImage: 'ubuntu-latest'
        # 🔒 QA TO PROD APPROVAL GATE: Pipeline stops here until manually authorized in the UI
        environment: 'PROD-Environment-Gate'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-env-template.yml
                  parameters:
                    environment: 'prod'
                    azureServiceConnection: '$(azureServiceConnection)'
                    backendRG: '$(backendRG)'
                    backendStorage: '$(backendStorage)'
                    backendContainer: '$(backendContainer)'
                    projectPrefix: '$(projectPrefix)'
                    imageRepository: '$(imageRepository)'
                    imageTag: '$(Build.BuildId)'
