# Verified Multi-Environment Terraform Pipeline
trigger:
  - master

# 1. Allow the user to select the target environment at runtime
parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - qa
      - prod

variables:
  azureServiceConnection: 'azure'
  backendRG: 'RG'
  backendStorage: 'tfstatefilestore1678'
  backendContainer: 'tfstate-container'

stages:
  - stage: ProvisionInfrastructure
    displayName: 'Provision Infrastructure'
    pool: 
      vmImage: 'ubuntu-latest'
    jobs:
      - job: ExecuteTerraform
        displayName: 'Run Pipeline Sequence'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform Engine'
            inputs:
              terraformVersion: 'latest'
          
          - task: TerraformTask@5
            displayName: 'Initialize State Backend'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(backendRG)'
              backendAzureRmStorageAccountName: '$(backendStorage)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '${{ parameters.environment }}.terraform.tfstate'

          - task: TerraformTask@5
            displayName: 'Static Schema Validation'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'

          - task: TerraformTask@5
            displayName: 'Generate Structural Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-var-file="environments/${{ parameters.environment }}.tfvars"'
            
          - task: TerraformTask@5
            displayName: 'Apply Modifications to Azure'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infrastructure'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-var-file="environments/${{ parameters.environment }}.tfvars" -auto-approve'
